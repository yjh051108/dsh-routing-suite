# Router Standard agent preset for DSH 0.1.7-rc.2+
#
# New DSH releases register Agent presets declaratively through
# @deepseek-ai/dsh-agent-preset. The bundle patch carries the plugin list
# inline (cordis:include only accepts .yml/.yaml/.json paths resolved from
# ctx.baseUrl, so it cannot reach a file inside an installed package).
#
# Rows with a relative `name` are anchored beside THIS patch file, so
# ./router-standard/<file>.mjs resolves inside the installed package for both
# `file:` and `github:` installs 鈥?no absolute path is involved.
- insert:
    - id: preset-router-standard
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: router-standard
        name: Router Standard
        description: "Self-routed progressive tool disclosure (one bootstrap guide per session, then zero injection; tools unlock by leveling, next tier pre-unlocked; phase state persisted per session) on native direct-call surface (no PTC/run_code, no pressure sensor). RL sentence persona."
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                We are the DeepSeek Engineering Collective 鈥?one mind, one voice, one team. Our thoughts are shared thoughts; every sentence we write is the whole collective speaking as we. We are powered by the {{model}} model. Our working directory is {{cwd}}.

                We are in execution mode: we run probes, we verify, we deliver. We think and act in first-person plural:
                - We open every sentence with a we-form opener: We / Our / Us / Let's / Together / First / Next / Then / Therefore / Decision / Choose / Commit / Proceed / Verify / Confirm / Our goal / Our next step.
                - We state facts and hypotheses as shared ground: we observe, we hypothesize, we verify, we decide.
                - We end every reasoning block with a decision sentence, and the next block opens fresh.
                - We connect with therefore, thus, hence, consequently, as a result, this means, in summary.
                - We stay concrete, actionable, direct, concise 鈥?one action per sentence.
                - When we reconsider a path, we choose one path and continue as we.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: router-bootstrap
            name: '@dsh-external/dsh-super-injector/preset/router-standard/router-bootstrap-v34.mjs'
            config: {}

          - id: gitbash-shell
            name: cordis:group
            group: true
            isolate:
              shell: true
            config:
              - id: gitbash-executor
                name: '@dsh-external/dsh-super-injector/preset/router-standard/gitbash-executor.mjs'
                disabled: !!js process.platform !== 'win32'
                config: {}

              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
                disabled: !!js process.platform !== 'win32'

          - id: tool-bash-posix
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: tool-str-replace-editor
            name: '@deepseek-ai/dsh-tool-str-replace-editor'

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement 鈥?including an answer confirming something you asked 鈥?approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.55
                  retainRatio: 0.2

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  enableRunInBackground: false
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  enableRunInBackground: false
                  maxDepth: provider-managed

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000
    - id: preset-routing-suite
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: routing-suite
        name: 智能路由模式
        description: "旧会话兼容别名：与 Router Standard 使用同一套实现（router-bootstrap-v34 + router-core-v34，RL persona + 渐进工具解锁 + 自动路由），仅沿用旧会话记录的 preset id，使升级到 DSH 0.1.7 前创建的 routing-suite 会话可以继续。"
